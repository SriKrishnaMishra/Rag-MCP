services:
  api:
    build: .
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      RAG_STORAGE_BACKEND: persistent
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://rag_user:${POSTGRES_PASSWORD:-change-me}@postgres:5432/rag_engineer}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-rag_chunks}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      REDIS_URL: redis://redis:6379/0
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      TENANT_API_KEYS: ${TENANT_API_KEYS-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-0}
      RATE_LIMIT_FAIL_OPEN: ${RATE_LIMIT_FAIL_OPEN:-false}
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - default
      - public_proxy
    logging: &rotating-logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    build: .
    restart: unless-stopped
    command: celery -A workers.celery_app worker --loglevel=INFO
    environment:
      RAG_STORAGE_BACKEND: persistent
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://rag_user:${POSTGRES_PASSWORD:-change-me}@postgres:5432/rag_engineer}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-rag_chunks}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: *rotating-logs

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag_engineer
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_engineer"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *rotating-logs

  qdrant:
    image: qdrant/qdrant:v1.12.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O - http://localhost:6333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - qdrant_data:/qdrant/storage
    logging: *rotating-logs

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *rotating-logs

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["public"]
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-}
    entrypoint: ["sh", "-c", "test -n \"$$CADDY_DOMAIN\" || { echo 'Set CADDY_DOMAIN before enabling the public profile' >&2; exit 1; }; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - public_proxy
    logging: *rotating-logs

volumes:
  postgres_data:
  qdrant_data:
  caddy_data:
  caddy_config:

networks:
  default: {}
  public_proxy: {}
