[project]
name = "mcp-rag-engineer"
version = "0.1.0"
description = "A safe MCP-powered RAG backend inspection starter"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "mcp>=1.0,<2.0",
  "alembic>=1.14,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "qdrant-client>=1.14,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "celery[redis]>=5.4,<6.0",
  "pypdf>=5.0,<7.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "mcp_servers*", "rag_core*", "workers*"]
